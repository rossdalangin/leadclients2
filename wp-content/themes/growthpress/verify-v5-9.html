<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrowthPress v5.9 Cinematic Design Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=Lexend:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-glow: rgba(79, 70, 229, 0.15);
            --secondary: #1E1B4B;
            --bg: #F9FAFB;
            --surface-rgb: 255, 255, 255;
            --radius: 32px;
            --blur: 40px;
            --speed: 0.8s;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            margin: 0; padding: 100px;
            display: flex; flex-direction: column; gap: 100px;
            align-items: center;
        }

        .glass-card {
            width: 600px;
            background: linear-gradient(135deg, rgba(var(--surface-rgb), 0.85) 0%, rgba(var(--surface-rgb), 0.65) 100%);
            backdrop-filter: blur(var(--blur)) saturate(190%);
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: var(--radius);
            padding: 80px;
            box-shadow: 0 20px 40px -4px rgba(0,0,0,0.04);
            transition: transform var(--speed) var(--ease-out-expo), box-shadow var(--speed) ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .glass-card:hover {
            transform: translateY(-30px) scale(1.03) rotateX(2deg);
            box-shadow: 0 60px 100px -20px rgba(0, 0, 0, 0.12), 0 0 100px var(--primary-glow);
            border-color: #FFF;
            z-index: 10;
        }

        .glass-card::after {
            content: "";
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: rotate(25deg);
            transition: none;
            pointer-events: none;
            opacity: 0;
        }

        .glass-card:hover::after {
            animation: glass-shimmer 1.5s var(--ease-out-expo) forwards;
        }

        @keyframes glass-shimmer {
            0% { transform: rotate(25deg) translate(-100%, -100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: rotate(25deg) translate(100%, 100%); opacity: 0; }
        }

        h1 { font-weight: 950; font-size: 4rem; letter-spacing: -0.08em; margin: 0; }
        p { opacity: 0.6; font-size: 1.2rem; margin-top: 20px; }

        .niche-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px;
        }

        .niche-node {
            padding: 40px; border-radius: 20px; color: white; font-weight: 900; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .dental { background: #0EA5E9; }
        .law { background: #1E293B; }
        .solar { background: #F59E0B; }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>Cinematic v5.9</h1>
        <p>Interactive glass physics with shimmer and magnetic hover.</p>
    </div>

    <div class="niche-grid">
        <div class="niche-node dental">DENTAL OS</div>
        <div class="niche-node law">LAW OS</div>
        <div class="niche-node solar">SOLAR OS</div>
    </div>

</body>
</html>
